
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панель скриптов</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #0d1117;
    --surface2: #131920;
    --surface3: #1a2230;
    --border: #1e2d3d;
    --border2: #253545;
    --accent: #00d4ff;
    --accent2: #ff4d6d;
    --accent3: #39ff14;
    --accent4: #ffd700;
    --text: #c9d8e8;
    --muted: #4a6070;
    --muted2: #6a8090;
    --glow: 0 0 12px rgba(0,212,255,0.4);
    --glow2: 0 0 12px rgba(57,255,20,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px); pointer-events: none; z-index: 9000; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 54px; border-bottom: 1px solid var(--border); background: var(--surface); position: relative; flex-shrink: 0; }
  header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.5; }

  .logo { font-family: 'Share Tech Mono', monospace; font-size: 14px; color: var(--accent); display: flex; align-items: center; gap: 10px; letter-spacing: 0.12em; text-shadow: var(--glow); }
  .logo-badge { background: var(--accent); color: #000; font-size: 9px; padding: 2px 6px; border-radius: 2px; font-weight: 700; letter-spacing: 0.1em; animation: pulse-badge 2s infinite; }
  @keyframes pulse-badge { 0%,100%{opacity:1}50%{opacity:0.6} }

  .header-right { display: flex; align-items: center; gap: 10px; }
  .stats-bar { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--muted2); display: flex; gap: 16px; margin-right: 8px; }
  .stats-bar span span { color: var(--accent); }

  .btn { font-family: 'Share Tech Mono', monospace; font-size: 11px; padding: 7px 14px; border-radius: 3px; border: none; cursor: pointer; transition: all 0.15s ease; letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px; }
  .btn-primary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn-primary:hover { background: var(--accent); color: #000; box-shadow: var(--glow); }
  .btn-ghost { background: transparent; color: var(--muted2); border: 1px solid var(--border2); }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted2); }
  .btn-danger { background: transparent; color: var(--accent2); border: 1px solid transparent; padding: 6px 10px; }
  .btn-danger:hover { background: rgba(255,77,109,0.1); border-color: var(--accent2); }
  .btn-run { background: var(--accent3); color: #000; font-weight: 700; border: none; padding: 7px 16px; box-shadow: var(--glow2); }
  .btn-run:hover { background: #50ff30; }
  .btn-copy { background: var(--surface3); color: var(--text); border: 1px solid var(--border2); padding: 7px 14px; }
  .btn-copy:hover { border-color: var(--accent); color: var(--accent); }

  .main { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 54px); }

.sidebar {
  width: 270px;
  min-width: 270px;
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  height: 100%; /* make sidebar full viewport height */
  overflow: hidden; /* top area stays static */
}

.sidebar-top {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0; /* prevents it from shrinking when list scrolls */
}

/* Script list scrolls */
.script-list {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 8px;
}


/* Script items styling stays the same */
.script-item {
  border-radius: 3px;
  padding: 10px 12px;
  margin-bottom: 3px;
  cursor: pointer;
  border: 1px solid transparent;
  border-left: 2px solid transparent;
  transition: all 0.12s ease;
}
.script-item:hover {
  background: var(--surface2);
  border-color: var(--border);
  border-left-color: var(--muted);
}
.script-item.active {
  background: var(--surface2);
  border-color: var(--border2);
  border-left-color: var(--accent);
}
.script-item-name {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--text);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.script-item.active .script-item-name {
  color: var(--accent);
}
.script-item-desc {
  font-size: 11px;
  color: var(--muted2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.script-item-tags {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  flex-wrap: wrap;
}
/* Search input & filters remain the same */
.search-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 8px 11px;
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  outline: none;
  transition: border 0.15s;
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 6px rgba(0,212,255,0.2);
}
.search-input::placeholder {
  color: var(--muted);
}
.filter-row {
  display: flex;
  gap: 5px;
}
.filter-chip {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  padding: 4px 10px;
  border-radius: 2px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted2);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.06em;
}
.filter-chip:hover {
  color: var(--text);
  border-color: var(--border2);
}
.filter-chip.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  box-shadow: var(--glow);
}

/* Make the script list scrollable */
.script-list {
  flex: 1 1 auto; /* allow it to grow and shrink */
  overflow-y: auto;
  padding: 8px;
}

/* Scrollbar styling matches theme */
.script-list::-webkit-scrollbar {
  width: 4px; /* slightly wider for visibility */
}
.script-list::-webkit-scrollbar-thumb {
  background: var(--border2);
  border-radius: 3px;
}

/* Script items remain the same */
.script-item {
  border-radius: 3px;
  padding: 10px 12px;
  margin-bottom: 3px;
  cursor: pointer;
  border: 1px solid transparent;
  border-left: 2px solid transparent;
  transition: all 0.12s ease;
}
.script-item:hover {
  background: var(--surface2);
  border-color: var(--border);
  border-left-color: var(--muted);
}
.script-item.active {
  background: var(--surface2);
  border-color: var(--border2);
  border-left-color: var(--accent);
}
.script-item-name {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--text);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.script-item.active .script-item-name {
  color: var(--accent);
}
.script-item-desc {
  font-size: 11px;
  color: var(--muted2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.script-item-tags {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  flex-wrap: wrap;
}

  .tag { font-family: 'Share Tech Mono', monospace; font-size: 8px; padding: 2px 6px; border-radius: 2px; letter-spacing: 0.06em; text-transform: uppercase; }

  .panel-empty p { font-size: 14px; letter-spacing: 0.05em; }
  .panel-empty span { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--muted); }

  .panel-header { padding: 16px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--surface); flex-shrink: 0; }
  .panel-title { flex: 1; }

  .panel-body { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 18px; }

  .field-label { font-family: 'Share Tech Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted2); margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .field-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

  .desc-block { font-size: 13px; color: var(--muted2); line-height: 1.6; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-left: 2px solid var(--accent); border-radius: 0 3px 3px 0; }
  .code-block { background: #060a0e; border: 1px solid var(--border); border-radius: 3px; padding: 16px; font-family: 'Share Tech Mono', monospace; font-size: 11px; line-height: 1.65; overflow-x: auto; white-space: pre-wrap; word-break: break-word; color: #8dc8e8; max-height: 360px; overflow-y: auto; }
  .code-block::-webkit-scrollbar { width: 3px; height: 3px; }
  .code-block::-webkit-scrollbar-thumb { background: var(--border2); }

  .text-input, .textarea-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 9px 12px; color: var(--text); font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 500; outline: none; transition: border 0.15s; }
  .text-input:focus, .textarea-input:focus { border-color: var(--accent); box-shadow: 0 0 6px rgba(0,212,255,0.15); }
  .text-input::placeholder, .textarea-input::placeholder { color: var(--muted); }
  .textarea-code { font-family: 'Share Tech Mono', monospace; font-size: 11px; line-height: 1.65; resize: vertical; min-height: 220px; background: #060a0e; color: #8dc8e8; }

  .trigger-group { display: flex; gap: 8px; }
  .trigger-option { flex: 1; padding: 10px 12px; border-radius: 3px; border: 1px solid var(--border); background: var(--surface2); cursor: pointer; text-align: center; transition: all 0.15s; }
  .trigger-option input { display: none; }
  .trigger-option:hover { border-color: var(--border2); }
  .trigger-option.sel-auto { border-color: var(--accent4); background: rgba(255,215,0,0.06); }
  .trigger-option.sel-manual { border-color: var(--accent); background: rgba(0,212,255,0.05); }
  .trigger-label { font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 500; display: block; margin-bottom: 2px; }
  .trigger-option.sel-auto .trigger-label { color: var(--accent4); }
  .trigger-option.sel-manual .trigger-label { color: var(--accent); }
  .trigger-sublabel { font-size: 10px; color: var(--muted2); }

  .tag-input-row { display: flex; gap: 8px; }
  .tag-input-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 7px 10px; color: var(--text); font-family: 'Share Tech Mono', monospace; font-size: 11px; outline: none; }
  .tag-input-row input:focus { border-color: var(--accent); }
  .tag-input-row input::placeholder { color: var(--muted); }
  .tag-list { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
  .tag-removable { font-family: 'Share Tech Mono', monospace; font-size: 9px; padding: 3px 8px; border-radius: 2px; background: rgba(255,255,255,0.05); color: var(--muted2); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.1s; }
  .tag-removable:hover { background: rgba(255,77,109,0.1); color: var(--accent2); border-color: var(--accent2); }

  .copy-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(5px); z-index: 500; align-items: center; justify-content: center; }
  .copy-overlay.open { display: flex; }
  .copy-modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 4px; padding: 22px; width: 640px; max-width: 92vw; max-height: 82vh; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 40px rgba(0,212,255,0.12), 0 0 80px rgba(0,0,0,0.6); position: relative; }
  .copy-modal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.6; }
  .copy-modal-header { display: flex; align-items: center; justify-content: space-between; }
  .copy-modal-title { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--accent3); text-shadow: var(--glow2); letter-spacing: 0.1em; }
  .copy-modal-code { background: #040810; border: 1px solid var(--border2); border-radius: 3px; padding: 14px; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #8dc8e8; line-height: 1.65; overflow-y: auto; max-height: 340px; white-space: pre-wrap; word-break: break-word; flex: 1; }
  .copy-modal-code::-webkit-scrollbar { width: 3px; }
  .copy-modal-code::-webkit-scrollbar-thumb { background: var(--border2); }
  .copy-hint { font-size: 12px; color: var(--muted2); padding: 8px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; line-height: 1.5; }
  .copy-hint strong { color: var(--accent); font-family: 'Share Tech Mono', monospace; }
  .copy-modal-footer { display: flex; gap: 8px; justify-content: flex-end; }

  .close-btn { background: none; border: none; color: var(--muted2); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 3px; transition: all 0.1s; font-family: 'Share Tech Mono', monospace; }
  .close-btn:hover { color: var(--accent2); }

  .toast { position: fixed; bottom: 22px; right: 22px; background: var(--surface2); border: 1px solid var(--border2); border-left: 2px solid var(--accent3); border-radius: 3px; padding: 10px 16px; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--text); opacity: 0; transform: translateY(8px); transition: all 0.2s ease; pointer-events: none; z-index: 9999; display: flex; align-items: center; gap: 10px; box-shadow: 0 0 20px rgba(57,255,20,0.1); }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent3); flex-shrink: 0; box-shadow: var(--glow2); }
  .empty-list { text-align: center; padding: 40px 20px; color: var(--muted); font-family: 'Share Tech Mono', monospace; font-size: 11px; line-height: 1.8; }
</style>
</head>

<script>
const PRELOADED = [
  {
    id:'builtin_world_grid',name:'Координаты в Блоке',
    description:'Hooks into the layer0 canvas to draw a red 32px world grid with wrapped tile coordinates (0-31). Also tracks all drawImage calls to detect block positions. Use toggleWorldGrid(), getBlockAt(x,y), getAllBlocks().',
    trigger:'manual',tags:['canvas','debug','grid'],runCount:0,created:1700000000000,builtin:true,
    code:`(() => {
  let layer0Ctx = null;
  let showWorldGrid = true;
  let blockPositions = {};
  
  const drawWorldGrid = () => {
    if (!layer0Ctx || !showWorldGrid) return;
    const transform = layer0Ctx.getTransform();
    if (Math.abs(transform.e) < 10 && Math.abs(transform.f) < 10) return;
    layer0Ctx.strokeStyle = 'rgba(255, 0, 0, 0.6)';
    layer0Ctx.lineWidth = 1;
    const tileSize = 32;
    const scale = transform.a;
    const worldLeft = -transform.e / scale;
    const worldTop = -transform.f / scale;
    const worldRight = worldLeft + layer0Ctx.canvas.width / scale;
    const worldBottom = worldTop + layer0Ctx.canvas.height / scale;
    const startX = Math.floor(worldLeft / tileSize) * tileSize;
    const startY = Math.floor(worldTop / tileSize) * tileSize;
    for (let x = startX; x <= worldRight + tileSize; x += tileSize) {
      layer0Ctx.beginPath(); layer0Ctx.moveTo(x, worldTop - tileSize); layer0Ctx.lineTo(x, worldBottom + tileSize); layer0Ctx.stroke();
    }
    for (let y = startY; y <= worldBottom + tileSize; y += tileSize) {
      layer0Ctx.beginPath(); layer0Ctx.moveTo(worldLeft - tileSize, y); layer0Ctx.lineTo(worldRight + tileSize, y); layer0Ctx.stroke();
    }
    layer0Ctx.fillStyle = 'rgba(255, 255, 0, 0.9)';
    layer0Ctx.font = 'bold 10px monospace';
    for (let x = startX; x <= worldRight; x += tileSize) {
      for (let y = startY; y <= worldBottom; y += tileSize) {
        const wx = ((Math.floor(x/tileSize)%32)+32)%32;
        const wy = ((Math.floor(y/tileSize)%32)+32)%32;
        layer0Ctx.fillText(wx+','+wy, x+2, y+12);
      }
    }
  };
  
  const hookCanvasContext = (ctx, canvas) => {
    if (canvas.id === 'layer0') {
      layer0Ctx = ctx;
      console.log('World grid hooked - 32px tiles, 32x32 wrapped world');
      const proto = Object.getPrototypeOf(ctx);
      const origRestore = proto.restore, origSave = proto.save, origDraw = proto.drawImage;
      let saveCount = 0;
      proto.save = function(...a) { saveCount++; return origSave.apply(this,a); };
      proto.restore = function(...a) { if(canvas.id==='layer0'&&saveCount>0) drawWorldGrid(); saveCount--; return origRestore.apply(this,a); };
      proto.drawImage = function(image,...args) {
        if (canvas.id === 'layer0') {
          let wx,wy,w,h;
          if(args.length===2){wx=args[0];wy=args[1];w=image.width;h=image.height;}
          else if(args.length===4){wx=args[0];wy=args[1];w=args[2];h=args[3];}

        if (serverMessages.length > 0) {
            const combinedMessage = \`🎮 \${serverName} [{\$USER_ID.substring(0, 6)}]\n\${serverMessages.join('\n')}\`;
            const success = await sendToTelegram(combinedMessage);

            if (success) {
                totalMessagesSent += serverMessages.length;
                updateStatus();
            }
        }
    }

    async function sendToTelegram(message) {
        try {
            const response = await fetch(\`https://api.telegram.org/bot\${BOT_TOKEN}/sendMessage\`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            });

            if (response.ok) {
                console.log('✅ Message sent to Telegram');
                return true;
            } else {
                console.error('❌ Failed to send message');
                return false;
            }
        } catch (error) {
            console.error('❌ Error sending to Telegram:', error);
            return false;
        }
    }

    function init() {
        console.log('🎮 Enhanced GoB Monitor loaded with fixes');

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(() => {
                    createUI();
                    startMonitoring();
                }, 3000);
            });
        } else {
            setTimeout(() => {
                createUI();
                startMonitoring();
            }, 3000);
        }
    }

    init();
})();`
  }
];

let scripts=[],activeId=null,currentFilter='all',searchQuery='',editingId=null,formTags=[];

function loadScripts(){
  const saved=JSON.parse(localStorage.getItem('scriptdash_gob_v1')||'[]');
  const savedIds=new Set(saved.map(s=>s.id));
  scripts=[...saved];
  for(const p of PRELOADED){if(!savedIds.has(p.id))scripts.push(p);}
}

function save(){localStorage.setItem('scriptdash_gob_v1',JSON.stringify(scripts));updateStats();}

function updateStats(){
  document.getElementById('statTotal').textContent=scripts.length;
  document.getElementById('statAuto').textContent=scripts.filter(s=>s.trigger==='auto').length;
  document.getElementById('statManual').textContent=scripts.filter(s=>s.trigger==='manual').length;
}

function toast(msg){const el=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}

function setFilter(f,el){currentFilter=f;document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');renderList();}
function filterScripts(q){searchQuery=q.toLowerCase();renderList();}
function filteredScripts(){return scripts.filter(s=>{const mf=currentFilter==='all'||s.trigger===currentFilter;const ms=!searchQuery||s.name.toLowerCase().includes(searchQuery)||(s.description||'').toLowerCase().includes(searchQuery)||(s.tags||[]).some(t=>t.toLowerCase().includes(searchQuery));return mf&&ms;});}

function renderList(){
  const list=document.getElementById('scriptList');
  const items=filteredScripts();
  if(!items.length){list.innerHTML='<div class="empty-list">// скрипты не найдены</div>';updateStats();return;}
  list.innerHTML=items.map(s=>`<div class="script-item ${s.id===activeId?'active':''}" onclick="selectScript('${s.id}')"><div class="script-item-name">${escHtml(s.name)}</div>${s.description?`<div class="script-item-desc">${escHtml(s.description)}</div>`:''}<div class="script-item-tags"><span class="tag ${s.trigger==='auto'?'tag-auto':'tag-manual'}">${s.trigger==='auto'?'авто':'ручной'}</span>${(s.tags||[]).map(t=>`<span class="tag tag-custom">${escHtml(t)}</span>`).join('')}</div></div>`).join('');
  updateStats();
}

function selectScript(id){activeId=id;renderList();const s=scripts.find(x=>x.id===id);if(s)renderView(s);}

function renderView(s){
  editingId=null;
  const rc=s.runCount||0;
  document.getElementById('panel').innerHTML=`
    <div class="panel-header">
      <div class="panel-title">
        <div class="panel-name">${escHtml(s.name)}</div>
        <div class="panel-meta">
          <span class="tag ${s.trigger==='auto'?'tag-auto':'tag-manual'}">${s.trigger==='auto'?'авто':'ручной'}</span>
          ${(s.tags||[]).map(t=>`<span class="tag tag-custom">${escHtml(t)}</span>`).join('')}
          <span class="run-badge">▶ ${rc} ЗАПУСК${rc===1?'':rc>=2&&rc<=4?'А':'ОВ'}</span>
        </div>
      </div>
      <div class="panel-actions">
        ${!s.builtin?`<button class="btn btn-danger" onclick="deleteScript('${s.id}')">✕</button>`:''}
        <button class="btn btn-ghost" onclick="editScript('${s.id}')">✎ ИЗМЕНИТЬ</button>
        <button class="btn btn-copy" onclick="showCopyModal('${s.id}')">⎘ КОПИРОВАТЬ</button>
        <button class="btn btn-run" onclick="runScript('${s.id}')">▶ ЗАПУСТИТЬ</button>
      </div>
    </div>
    <div class="panel-body">
      ${s.description?`<div><div class="field-label">Описание</div><div class="desc-block">${escHtml(s.description)}</div></div>`:''}
      <div><div class="field-label">Код</div><div class="code-block">${escHtml(s.code)}</div></div>
    </div>`;
}

function runScript(id){const s=scripts.find(x=>x.id===id);if(!s)return;s.runCount=(s.runCount||0)+1;save();showCopyModal(id);}
function showCopyModal(id){const s=scripts.find(x=>x.id===id);if(!s)return;document.getElementById('copyModalTitle').textContent='▶ '+s.name.toUpperCase();document.getElementById('copyModalCode').textContent=s.code;document.getElementById('copyOverlay').classList.add('open');}
function closeCopyModal(e){if(!e||e.target===document.getElementById('copyOverlay'))document.getElementById('copyOverlay').classList.remove('open');}
function copyModalCode(){navigator.clipboard.writeText(document.getElementById('copyModalCode').textContent).then(()=>toast('СКОПИРОВАНО В БУФЕР'));}

function newScript(){activeId=null;editingId=null;formTags=[];renderList();renderForm(null);}
function editScript(id){editingId=id;const s=scripts.find(x=>x.id===id);formTags=s?[...(s.tags||[])]:[];renderForm(s);}

function renderForm(s){
  const isNew=!s;
  document.getElementById('panel').innerHTML=`
    <div class="panel-header">
      <div class="panel-title"><div class="panel-name">${isNew?'// НОВЫЙ СКРИПТ':'// ИЗМЕНИТЬ: '+escHtml(s.name)}</div></div>
      <div class="panel-actions">
        ${!isNew?`<button class="btn btn-ghost" onclick="selectScript('${s.id}')">ОТМЕНА</button>`:''}
        <button class="btn btn-primary" onclick="saveForm()">✓ СОХРАНИТЬ</button>
      </div>
    </div>
    <div class="panel-body">
      <div><div class="field-label">Название скрипта</div><input id="f_name" class="text-input" placeholder="напр. Координаты в Тайлах" value="${s?escAttr(s.name):''}"></div>
      <div><div class="field-label">Описание</div><input id="f_desc" class="text-input" placeholder="Что делает этот скрипт?" value="${s?escAttr(s.description||''):''}"></div>
      <div><div class="field-label">Тип запуска</div><div class="trigger-group">
        <label class="trigger-option ${(!s||s.trigger==='manual')?'sel-manual':''}"><input type="radio" name="trigger" value="manual" ${(!s||s.trigger==='manual')?'checked':''} onchange="updateTriggerStyle()"><span class="trigger-label">РУЧНОЙ</span><span class="trigger-sublabel">запуск по требованию</span></label>
        <label class="trigger-option ${s&&s.trigger==='auto'?'sel-auto':''}"><input type="radio" name="trigger" value="auto" ${s&&s.trigger==='auto'?'checked':''} onchange="updateTriggerStyle()"><span class="trigger-label">АВТО-ЗАПУСК</span><span class="trigger-sublabel">при загрузке страницы</span></label>
      </div></div>
      <div><div class="field-label">Теги</div><div class="tag-input-row"><input id="tagInput" placeholder="добавить тег + Enter" onkeydown="addTagOnEnter(event)"><button class="btn btn-ghost" style="padding:7px 12px;font-size:10px" onclick="addTag()">ДОБАВИТЬ</button></div><div class="tag-list" id="tagList">${renderTagList()}</div></div>
      <div><div class="field-label">Код</div><textarea id="f_code" class="textarea-input textarea-code" placeholder="// вставьте JavaScript код сюда...">${s?escHtml(s.code):''}</textarea></div>
    </div>`;
}

function updateTriggerStyle(){document.querySelectorAll('.trigger-option').forEach(el=>{const r=el.querySelector('input[type=radio]');el.classList.remove('sel-auto','sel-manual');if(r.checked)el.classList.add(r.value==='auto'?'sel-auto':'sel-manual');});}
function renderTagList(){return formTags.map((t,i)=>`<button class="tag-removable" onclick="removeTag(${i})">${escHtml(t)} ×</button>`).join('');}
function addTagOnEnter(e){if(e.key==='Enter'){e.preventDefault();addTag();}}
function addTag(){const inp=document.getElementById('tagInput');const val=inp.value.trim();if(val&&!formTags.includes(val)){formTags.push(val);document.getElementById('tagList').innerHTML=renderTagList();}inp.value='';inp.focus();}
function removeTag(i){formTags.splice(i,1);document.getElementById('tagList').innerHTML=renderTagList();}

function saveForm(){
  const name=document.getElementById('f_name').value.trim();
  const code=document.getElementById('f_code').value.trim();
  if(!name){toast('ВВЕДИТЕ НАЗВАНИЕ СКРИПТА');return;}
  if(!code){toast('ВВЕДИТЕ КОД');return;}
  const trigger=document.querySelector('input[name="trigger"]:checked')?.value||'manual';
  const desc=document.getElementById('f_desc').value.trim();
  if(editingId){
    const s=scripts.find(x=>x.id===editingId);
    if(s){s.name=name;s.code=code;s.trigger=trigger;s.description=desc;s.tags=[...formTags];s.builtin=false;}
    activeId=editingId;editingId=null;toast('СКРИПТ ОБНОВЛЁН');
  }else{
    const s={id:'sc_'+Date.now(),name,code,trigger,description:desc,tags:[...formTags],runCount:0,created:Date.now()};
    scripts.push(s);activeId=s.id;toast('СКРИПТ СОХРАНЁН');
  }
  save();renderList();selectScript(activeId);
}

function deleteScript(id){
  if(!confirm('Удалить этот скрипт?'))return;
  scripts=scripts.filter(x=>x.id!==id);activeId=null;save();renderList();
  document.getElementById('panel').innerHTML='<div class="panel-empty"><div class="panel-empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div><p>СКРИПТ УДАЛЁН</p><span>// выберите или создайте новый скрипт</span></div>';
  toast('СКРИПТ УДАЛЁН');
}

function exportScripts(){const b=new Blob([JSON.stringify(scripts,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='scriptdash-gob.json';a.click();toast('ЭКСПОРТИРОВАНО');}
function importScripts(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(!Array.isArray(data))throw new Error();let added=0;const ids=new Set(scripts.map(s=>s.id));data.forEach(s=>{if(!ids.has(s.id)){scripts.push(s);added++;}});save();renderList();toast('ИМПОРТИРОВАНО '+added+' СКРИПТ'+(added===1?'':added>=2&&added<=4?'А':'ОВ'));}catch{toast('НЕВЕРНЫЙ ФАЙЛ');}};r.readAsText(file);e.target.value='';}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escAttr(s){return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

loadScripts();save();renderList();
if(scripts.length)selectScript(scripts[0].id);
</script>
</body>
